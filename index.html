<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <meta name="description" content="Play Simon Says, a colorful memory game that challenges you to repeat increasingly long sequences." />
    <meta name="keywords" content="Simon Says, memory game, sequence game, brain game" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Simon Says | Memory Game" />
    <meta property="og:description" content="Test your memory by repeating increasingly challenging color sequences." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Simon Says | Memory Game" />
    <meta name="twitter:description" content="Test your memory with increasingly challenging color sequences." />
    <title>Simon Says | Memory Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <header>
        <h1>SIMON <span>SAYS</span></h1>
    </header>

    <div class="status-bar">
        <div class="score-box">
            <span class="label">LEVEL</span>
            <span id="level-display">0</span>
        </div>
        <div id="message">Press any key to start</div>
        <div class="score-box">
            <span class="label">BEST</span>
            <span id="best-display">0</span>
        </div>
    </div>

    <div class="game-wrapper">
        <div class="btn-container">
            <div class="btn red"   id="red"></div>
            <div class="btn blue"  id="blue"></div>
            <div class="btn green" id="green"></div>
            <div class="btn yellow"id="yellow"></div>
        </div>
        <div class="center-logo">
            <div class="logo-ring"></div>
            <span>S</span>
        </div>
    </div>

    <footer>
        <p>Made with <span class="heart">♥</span> at <strong>Apna College</strong></p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
